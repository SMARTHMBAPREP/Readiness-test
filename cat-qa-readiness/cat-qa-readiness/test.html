<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CAT QA Readiness Test</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#0b1f3a;--mut:#5b6b82;--teal:#00a9b5;--amb:#f5a623;--ok:#1e9e5a;--bad:#d64545;--bd:#d9e0ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1424;--card:#13223a;--ink:#e8eef8;--mut:#9fb0c8;--bd:#263a58}}
:root[data-theme="dark"]{--bg:#0a1424;--card:#13223a;--ink:#e8eef8;--mut:#9fb0c8;--bd:#263a58}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.hdr{background:#0b1f3a;color:#fff;border-radius:14px;padding:18px 20px;border-bottom:4px solid var(--teal)}
.hdr small{color:var(--amb);letter-spacing:.08em;font-weight:600}.hdr h1{margin:4px 0 2px;font-size:1.4rem}.hdr p{margin:0;color:#c5d2e6;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-top:14px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 18px;font-weight:600}
.pri{background:var(--teal);color:#032a2e}.sec{background:transparent;color:var(--ink);border:1px solid var(--bd)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#0b1f3a;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-radius:12px;margin-top:12px}
#tm{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--amb)}#tm.low{color:#ff6b6b}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.pal button{width:36px;height:36px;padding:0;background:var(--card);border:1px solid var(--bd);color:var(--ink)}
.pal .ans{background:var(--teal);color:#032a2e;border-color:var(--teal)}.pal .cur{outline:2px solid var(--amb)}.pal .mk{box-shadow:inset 0 -4px 0 var(--amb)}
.tag{display:inline-block;font-size:.75rem;background:#0b1f3a;color:#fff;border-radius:6px;padding:2px 8px;margin-right:6px}.tag.t{background:var(--amb);color:#3a2600}
.q{font-size:1.1rem;margin:10px 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);color:var(--ink);margin:8px 0;font-weight:500}.opt.sel{border-color:var(--teal);background:rgba(0,169,181,.14)}
input[type=text]{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--ink);width:180px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
table{border-collapse:collapse;width:100%}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;font-size:.92rem}
.big{font-size:2.2rem;font-weight:800;color:var(--teal)}.ok{color:var(--ok)}.bad{color:var(--bad)}.rv{border-left:4px solid var(--bd);padding:8px 12px;margin:10px 0}.rv.c{border-color:var(--ok)}.rv.w{border-color:var(--bad)}
footer{text-align:center;color:var(--mut);font-size:.8rem;margin:18px 0 8px}
</style></head><body><div class="wrap">
<div class="hdr"><small>IMS JAIPUR | CAT</small><h1>QA Readiness Test</h1><p>Algebra Module: Equations, Polynomials, Surds &amp; Indices, Logs, Series, Graphs, Functions, Inequalities</p></div>
<div id="app"></div>
<footer>Curated by Smarth</footer></div>
<script>
const Q=[{"t": "EQ", "k": "tita", "q": "Find the number of positive integer solutions (x, y, z) of 3x + 5y + 7z = 100.", "o": null, "a": "41", "s": "Fix z = 1..13 and count positive solutions of 3x + 5y = 100 − 7z for each z; the counts add up to 41."}, {"t": "EQ", "k": "mcq", "q": "If one root of x² + px + q = 0 is the square of the other, then p³ + q² − 3pq + q equals", "o": ["3", "1", "0", "−1"], "a": 2, "s": "Roots r, r²: p = −(r + r²), q = r³. Expanding, p³ + q² − 3pq + q cancels completely to 0."}, {"t": "EQ", "k": "tita", "q": "For how many integer values of m does x² − mx + 36 = 0 have both roots integers?", "o": null, "a": "10", "s": "Roots are integer pairs (d, 36/d) with the same sign, and m = d + 36/d. Distinct values: ±12, ±13, ±15, ±20, ±37 ⇒ 10."}, {"t": "PO", "k": "mcq", "q": "The remainder when x¹⁰⁰ is divided by x² − 3x + 2 is", "o": ["(2¹⁰⁰ − 1)x − 2¹⁰⁰", "2¹⁰⁰x − 1", "(2¹⁰⁰ + 1)x + 2¹⁰⁰", "(2¹⁰⁰ − 1)x + 2 − 2¹⁰⁰"], "a": 3, "s": "Remainder = ax + b. At x = 1: a + b = 1. At x = 2: 2a + b = 2¹⁰⁰. So a = 2¹⁰⁰ − 1, b = 2 − 2¹⁰⁰."}, {"t": "PO", "k": "tita", "q": "If x + y + z = 6, x² + y² + z² = 14 and x³ + y³ + z³ = 36, find xyz.", "o": null, "a": "6", "s": "xy + yz + zx = (36 − 14)/2 = 11. Then x³ + y³ + z³ − 3xyz = 6 × (14 − 11) = 18 ⇒ 36 − 3xyz = 18 ⇒ xyz = 6."}, {"t": "PO", "k": "mcq", "q": "A cubic polynomial P(x) satisfies P(1) = 1, P(2) = 2, P(3) = 3 and P(4) = 10. Then P(6) equals", "o": ["60", "66", "54", "72"], "a": 1, "s": "P(x) − x has roots 1, 2, 3, so P(x) = x + k(x − 1)(x − 2)(x − 3). P(4) = 4 + 6k = 10 ⇒ k = 1. P(6) = 6 + 5·4·3 = 66."}, {"t": "SI", "k": "mcq", "q": "Which of the following is the largest?", "o": ["6^(1/6)", "5^(1/5)", "2^(1/2)", "3^(1/3)"], "a": 3, "s": "Raise each to the power 30: 2¹⁵ = 32768, 3¹⁰ = 59049, 5⁶ = 15625, 6⁵ = 7776. Largest is 3^(1/3)."}, {"t": "SI", "k": "mcq", "q": "The value of x satisfying 4ˣ − 3^(x − 1/2) = 3^(x + 1/2) − 2^(2x − 1) is", "o": ["2", "3/2", "1", "5/2"], "a": 1, "s": "Move terms: 4ˣ + 4ˣ/2 = 3ˣ(√3 + 1/√3) ⇒ (3/2)·4ˣ = 3ˣ·4/√3 ⇒ (4/3)ˣ = 8/(3√3) = (4/3)^(3/2) ⇒ x = 3/2."}, {"t": "SI", "k": "tita", "q": "Find the number of integer values of x for which (x² − 5x + 5)^(x² − 9x + 20) = 1.", "o": null, "a": "5", "s": "Case base = 1: x = 1, 4. Case exponent = 0 (base ≠ 0): x = 4, 5. Case base = −1 with even exponent: x = 2 (exp 6), x = 3 (exp 2). Distinct values: 1, 2, 3, 4, 5 ⇒ 5."}, {"t": "LG", "k": "mcq", "q": "If log₁₂18 = a and log₂₄54 = b, then ab + 5(a − b) equals", "o": ["2", "5", "1", "0"], "a": 2, "s": "Put p = log 2, q = log 3. a = (p + 2q)/(2p + q), b = (p + 3q)/(3p + q). Simplifying ab + 5(a − b) gives 1."}, {"t": "LG", "k": "tita", "q": "Given log₁₀2 = 0.3010 and log₁₀3 = 0.4771, find the number of digits in 6²⁰ × 15²⁵.", "o": null, "a": "45", "s": "6²⁰ × 15²⁵ = 2²⁰ · 3⁴⁵ · 5²⁵. log = 20(0.3010) + 45(0.4771) + 25(0.6990) = 44.9645 ⇒ 45 digits."}, {"t": "LG", "k": "mcq", "q": "The sum of all real solutions of log₂(x − 1) + log₂(x − 3) = 3 is", "o": ["4", "3", "9", "5"], "a": 3, "s": "(x − 1)(x − 3) = 8 ⇒ x² − 4x − 5 = 0 ⇒ x = 5 or −1. Domain needs x > 3, so only x = 5."}, {"t": "SS", "k": "mcq", "q": "The value of 1/(1·2·3) + 1/(2·3·4) + 1/(3·4·5) + … + 1/(98·99·100) is", "o": ["99/400", "4949/19800", "2475/9900", "4851/19800"], "a": 1, "s": "1/(n(n+1)(n+2)) = ½[1/(n(n+1)) − 1/((n+1)(n+2))]. Sum = ½(½ − 1/9900) = 4949/19800."}, {"t": "SS", "k": "mcq", "q": "Three positive numbers in GP have sum 21 and sum of squares 189. The largest of them is", "o": ["14", "9", "12", "18"], "a": 2, "s": "Let the numbers be a/r, a, ar and u = r + 1/r. Sum: a(u + 1) = 21. Sum of squares: a²(u² − 1) = 189 ⇒ a(u − 1) = 9. So 2a = 12 ⇒ a = 6, u = 5/2 ⇒ r = 2. The numbers are 3, 6, 12."}, {"t": "SS", "k": "tita", "q": "The AP 3, 7, 11, 15, … and the AP 2, 9, 16, 23, … both continue indefinitely. How many numbers below 1000 appear in both?", "o": null, "a": "35", "s": "Common terms satisfy n ≡ 3 (mod 4) and n ≡ 2 (mod 7); the first is 23 and the common difference is 28. 23 + 28k < 1000 ⇒ k = 0..34 ⇒ 35."}, {"t": "MM", "k": "mcq", "q": "The minimum value of |x − 1| + |2x − 4| + |3x − 9| is", "o": ["3", "6", "5", "4"], "a": 3, "s": "Breakpoints 1, 2, 3 with weights 1, 2, 3. The weighted median is x = 2: 1 + 0 + 3 = 4 (the value stays 4 up to x = 3)."}, {"t": "MM", "k": "mcq", "q": "The number of integer points (x, y) with |x| + |y| ≤ 10 that lie on or outside the circle x² + y² = 25 is", "o": ["144", "152", "148", "160"], "a": 1, "s": "Points in |x| + |y| ≤ 10: 2(10²) + 2(10) + 1 = 221. Points with x² + y² < 25 (all of which lie inside the diamond): 69. 221 − 69 = 152."}, {"t": "FN", "k": "mcq", "q": "If f(x) = (x − 1)/(x + 1), then f applied 2026 times to 5, i.e. f(f(…f(5)…)), equals", "o": ["−5", "5", "1/5", "−1/5"], "a": 3, "s": "f(f(x)) = −1/x, so f applied 4 times gives x. 2026 = 4 × 506 + 2, so the result is f(f(5)) = −1/5."}, {"t": "FN", "k": "mcq", "q": "The maximum value of f(x) = (x² + x + 1)/(x² + 1) over all real x is", "o": ["2", "5/4", "3/2", "4/3"], "a": 2, "s": "y(x² + 1) = x² + x + 1 ⇒ (y − 1)x² − x + (y − 1) = 0. Real x needs 1 − 4(y − 1)² ≥ 0 ⇒ y ∈ [1/2, 3/2]."}, {"t": "FN", "k": "tita", "q": "A function satisfies 3f(x) + 2f((x + 59)/(x − 1)) = 10x + 30 for all x ≠ 1. Find f(7).", "o": null, "a": "4", "s": "x = 7 gives (7 + 59)/6 = 11: 3f(7) + 2f(11) = 100. x = 11 gives 70/10 = 7: 3f(11) + 2f(7) = 140. Solving: f(7) = 4."}, {"t": "IN", "k": "tita", "q": "Find the number of integers x satisfying (x − 1)(x − 2)²(x − 3)³(x − 4)⁴ ≤ 0.", "o": null, "a": "4", "s": "Squared and fourth-power factors are ≥ 0, so the sign depends on (x − 1)(x − 3). Solution set is [1, 3] together with the isolated root x = 4. Integers: 1, 2, 3, 4 ⇒ 4."}, {"t": "IN", "k": "mcq", "q": "If x, y > 0 and 2x + 3y = 30, the maximum value of x²y³ is", "o": ["8000", "5184", "7776", "6000"], "a": 2, "s": "Split 2x + 3y into five parts: x, x, y, y, y. AM-GM gives equality at x = y, so x = y = 6 and x²y³ = 36 × 216 = 7776."}];const TN={"EQ": "Linear & Quadratic Equations", "PO": "Polynomials & Algebraic Formulae", "SI": "Surds & Indices", "LG": "Logarithms", "SS": "Sequences & Series", "MM": "Graphs & Maxima-Minima", "FN": "Functions", "IN": "Inequalities"};const TOTAL=40*60;
let ans=Array(Q.length).fill(null),mk=Array(Q.length).fill(false),cur=0,left=TOTAL,iv=null,done=false;
const app=document.getElementById('app');
const $=s=>document.querySelector(s);
function intro(){app.innerHTML=`<div class="card"><h2 style="margin-top:0">Instructions</h2><ul><li><b>22 questions, 40 minutes</b>, same pattern as CAT QA, at CAT-level difficulty (expect to leave a few).</li><li>14 MCQs: +3 for correct, &minus;1 for wrong. 8 TITA (type-in) questions: +3 for correct, no negative marking.</li><li>Use the palette to jump between questions; mark for review if unsure.</li><li>The test submits automatically when the timer hits zero.</li><li>Use pen and paper. No calculator.</li></ul><button class="pri" onclick="start()">Start Test</button></div>`}
function start(){iv=setInterval(()=>{left--;tick();if(left<=0)submit()},1000);render()}
function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function tick(){const e=$('#tm');if(e){e.textContent=fmt(left);e.className=left<300?'low':''}}
function render(){const q=Q[cur];let body='';
if(q.k==='mcq'){body=q.o.map((o,i)=>`<button class="opt ${ans[cur]===i?'sel':''}" onclick="pick(${i})">(${'ABCD'[i]}) ${o}</button>`).join('')}
else{body=`<input type="text" id="ti" inputmode="text" placeholder="Type your answer" value="${ans[cur]??''}" oninput="typed(this.value)">`}
app.innerHTML=`<div class="bar"><span>Q ${cur+1} / ${Q.length}</span><span id="tm">${fmt(left)}</span><button class="pri" onclick="if(confirm('Submit the test now?'))submit()">Submit</button></div>
<div class="card"><span class="tag">${TN[q.t]}</span><span class="tag t">${q.k==='mcq'?'MCQ':'TITA'}</span><div class="q">${cur+1}. ${q.q}</div>${body}
<div class="nav"><button class="sec" onclick="go(-1)" ${cur==0?'disabled':''}>&larr; Prev</button><button class="sec" onclick="clr()">Clear</button><button class="sec" onclick="mark()">${mk[cur]?'Unmark':'Mark for review'}</button><button class="pri" onclick="go(1)" ${cur==Q.length-1?'disabled':''}>Next &rarr;</button></div></div>
<div class="pal">${Q.map((_,i)=>`<button class="${ans[i]!==null&&ans[i]!==''?'ans':''} ${i==cur?'cur':''} ${mk[i]?'mk':''}" onclick="cur=${i};render()">${i+1}</button>`).join('')}</div>`}
function pick(i){ans[cur]=i;render()}function typed(v){ans[cur]=v.trim()===''?null:v.trim();const p=document.querySelectorAll('.pal button')[cur];p.classList.toggle('ans',ans[cur]!==null)}
function clr(){ans[cur]=null;render()}function mark(){mk[cur]=!mk[cur];render()}function go(d){cur=Math.min(Q.length-1,Math.max(0,cur+d));render()}
const norm=s=>String(s).replace(/[−–]/g,'-').replace(/\s/g,'');
function ok(i){const q=Q[i],a=ans[i];if(a===null||a==='')return null;return q.k==='mcq'?a===q.a:norm(a)===norm(q.a)}
function submit(){if(done)return;done=true;clearInterval(iv);let sc=0,c=0,w=0,u=0;const by={};
Q.forEach((q,i)=>{const r=ok(i);by[q.t]=by[q.t]||{n:0,c:0};by[q.t].n++;if(r===null)u++;else if(r){c++;sc+=3;by[q.t].c++}else{w++;if(q.k==='mcq')sc--}});
const used=TOTAL-Math.max(left,0);
const rows=Object.keys(by).map(t=>`<tr><td>${TN[t]}</td><td>${by[t].c} / ${by[t].n}</td><td>${Math.round(100*by[t].c/by[t].n)}%</td></tr>`).join('');
const rev=Q.map((q,i)=>{const r=ok(i);const given=ans[i]===null?'Not attempted':(q.k==='mcq'?'ABCD'[ans[i]]:ans[i]);const right=q.k==='mcq'?'ABCD'[q.a]+') '+q.o[q.a]:q.a;
return `<div class="rv ${r?'c':r===false?'w':''}"><b>${i+1}. ${q.q}</b><br>Your answer: <b class="${r?'ok':r===false?'bad':''}">${given}</b> &nbsp;|&nbsp; Correct: <b>${right}</b><br><small>${q.s}</small></div>`}).join('');
app.innerHTML=`<div class="card"><div class="big">${sc} / 66</div>Time used: ${fmt(used)} &nbsp;|&nbsp; Correct ${c} &nbsp; Wrong ${w} &nbsp; Skipped ${u}
<table style="margin-top:14px"><tr><th>Topic</th><th>Score</th><th>Accuracy</th></tr>${rows}</table>
<p style="color:var(--mut)">Topics under 50% need a revisit before your next mock.</p><button class="pri" onclick="location.reload()">Retake</button></div><div class="card"><h3 style="margin-top:0">Answers &amp; Solutions</h3>${rev}</div>`;window.scrollTo(0,0)}
intro();
</script></body></html>
